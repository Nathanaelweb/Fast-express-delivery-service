<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Chat - Fast Express Delivery</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #ffffff; /* white background */
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    animation: fadeIn .8s ease-in-out;
}

/* Fade-in animation */
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* Chat container */
.chat-container {
    width: 400px;
    background: #ffffff; /* white chat box */
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    color: #000000; /* black text for readability */
}

/* Header */
.chat-header {
    text-align: center;
    margin-bottom: 20px;
}
.chat-header h1 {
    color: #ff1a1a; /* red title */
    font-size: 26px;
    font-weight: 800;
}
.chat-header p {
    color: #990000; /* dark red subtitle */
    font-size: 14px;
}

/* Tracking input */
.track-input {
    display: flex;
    margin-bottom: 15px;
}
.track-input label {
    font-weight: bold;
    color: #ff1a1a; /* red label */
    width: 35%;
    align-self: center;
}
.track-input input {
    width: 65%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ff1a1a;
    background: #ffffff;
    color: #000000;
    outline: none;
    transition: 0.3s;
}
.track-input input:focus {
    border-color: #cc0000;
    box-shadow: 0 0 8px rgba(255,0,0,0.4);
}

/* Chat box */
#chat-box {
    height: 320px;
    overflow-y: auto;
    border: 1px solid #ff1a1a;
    padding: 15px;
    border-radius: 12px;
    background: #ffffff;
    margin-bottom: 15px;
    scrollbar-width: thin;
    scrollbar-color: #ff1a1a #ffffff;
}
#chat-box::-webkit-scrollbar {
    width: 8px;
}
#chat-box::-webkit-scrollbar-thumb {
    background-color: #ff1a1a;
    border-radius: 4px;
}
#chat-box::-webkit-scrollbar-track {
    background: #ffffff;
}

/* Messages */
.message {
    margin-bottom: 10px;
    padding: 12px 15px;
    border-radius: 15px;
    max-width: 75%;
    word-wrap: break-word;
    font-size: 14px;
    line-height: 1.4;
}
.sender-message {
    background: #ff1a1a; /* red bubble */
    color: #ffffff;
    text-align: right;
    margin-left: auto;
    box-shadow: 0 2px 8px rgba(255,0,0,0.25);
}
.receiver-message {
    background: #ffffff; /* white bubble */
    color: #000000;
    text-align: left;
    margin-right: auto;
    border: 1px solid #ff1a1a;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
.timestamp {
    display: block;
    font-size: 10px;
    color: #990000;
    margin-top: 5px;
}

/* Inputs & buttons */
.input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
}
.input-row input {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #ff1a1a;
    background: #ffffff;
    color: #000000;
    outline: none;
    transition: 0.3s;
}
.input-row input:focus {
    border-color: #cc0000;
    box-shadow: 0 0 8px rgba(255,0,0,0.4);
}
.input-row button {
    padding: 10px 15px;
    border-radius: 12px;
    border: none;
    background-color: #ff1a1a;
    color: #ffffff;
    cursor: pointer;
    font-weight: 700;
    transition: 0.3s;
    box-shadow: 0 4px 10px rgba(255,0,0,0.25);
}
.input-row button:hover {
    background-color: #cc0000;
    transform: translateY(-2px);
}

/* Camera Styles */
.camera-wrapper {
    position: relative;
    display: none;
    margin-top: 10px;
}
#camera {
    width: 100%;
    border-radius: 12px;
    border: 2px solid #ff1a1a;
}
.cancel-btn, .switch-btn {
    position: absolute;
    top: 8px;
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    color: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
.cancel-btn {
    right: 8px;
    background-color: #ff1a1a;
}
.cancel-btn:hover { background-color: #cc0000; }
.switch-btn {
    left: 8px;
    background-color: #ff4d4d;
}
.switch-btn:hover { background-color: #cc0000; }

</style>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
// Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyDsadz8GfNMOGaoHbzi7vB2LyvGb-ESxqs",
  authDomain: "musicdatabase-c57f8.firebaseapp.com",
  databaseURL: "https://musicdatabase-c57f8-default-rtdb.firebaseio.com",
  projectId: "musicdatabase-c57f8",
  storageBucket: "musicdatabase-c57f8.firebasestorage.app",
  messagingSenderId: "1081533752772",
  appId: "1:1081533752772:web:4e43c649e7e0bd7435f091",
  measurementId: "G-G9J9P224ZH"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let chatRef = null;

// Listen messages
function startChat(trackCode) {
    const chatBox = document.getElementById('chat-box');
    chatBox.innerHTML = ''; // clear previous chat

    if(chatRef) chatRef.off();
    chatRef = db.ref('chats/' + trackCode);

    // Show loading
    const loadingDiv = document.createElement('div');
    loadingDiv.id = 'loading';
    loadingDiv.textContent = 'Sending messages...';
    loadingDiv.style.fontStyle = 'italic';
    loadingDiv.style.textAlign = 'center';
    chatBox.appendChild(loadingDiv);

    // Fetch existing messages once
    chatRef.once('value', snapshot => {
        chatBox.innerHTML = ''; // remove loading
        if(snapshot.exists()) {
            snapshot.forEach(child => {
                const data = child.val();
                displayMessage(data.sender, data.text || '', data.timestamp, data.image || '');
            });
        } else {
            chatBox.innerHTML = '<div style="text-align:center; font-style:italic;">No messages yet.</div>';
        }
    });

    // Listen for new messages in real-time
    chatRef.on('child_added', snapshot => {
        const data = snapshot.val();
        displayMessage(data.sender, data.text || '', data.timestamp, data.image || '');
    });
}


function displayMessage(sender, text, timestamp, image) {
    const chatBox = document.getElementById('chat-box');
    const div = document.createElement('div');
    div.classList.add('message');
    div.classList.add(sender === 'Admin' ? 'sender-message' : 'receiver-message');

    if(image) {
        div.innerHTML = `<img src="${image}" style="max-width:100%; border-radius:5px;"><span class="timestamp">${timestamp}</span>`;
    } else {
        div.innerHTML = `${text} <span class="timestamp">${timestamp}</span>`;
    }

    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}

// Send text message
function sendMessage() {
    const trackCode = document.getElementById('track-code').value.trim();
    if(!trackCode) return alert('Enter tracking code!');
    const msgInput = document.getElementById('message-input');
    const text = msgInput.value.trim();
    if(!text) return;
    const timestamp = new Date().toLocaleTimeString();
    db.ref('chats/' + trackCode).push({ sender: 'Admin', text, timestamp });
    msgInput.value = '';
    startChat(trackCode);
}

// Camera
let stream;
let useFrontCamera = true;

function openCamera() {
    const wrapper = document.getElementById('camera-wrapper');
    const video = document.getElementById('camera');
    wrapper.style.display = 'block';

    const constraints = { video: { facingMode: useFrontCamera ? "user" : "environment" } };

    navigator.mediaDevices.getUserMedia(constraints)
        .then(s => { stream = s; video.srcObject = stream; })
        .catch(err => alert("Camera error: " + err));
}

function takeSnapshot() {
    const video = document.getElementById('camera');
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
    const imageData = canvas.toDataURL('image/png');

    const trackCode = document.getElementById('track-code').value.trim();
    if(!trackCode) return alert('Enter tracking code!');

    const timestamp = new Date().toLocaleTimeString();
    db.ref('chats/' + trackCode).push({ sender: 'Admin', image: imageData, timestamp });
    cancelCamera();
}

function cancelCamera() {
    const video = document.getElementById('camera');
    const wrapper = document.getElementById('camera-wrapper');
    if(stream) { stream.getTracks().forEach(track => track.stop()); stream = null; }
    wrapper.style.display = 'none';
}

function switchCamera() {
    useFrontCamera = !useFrontCamera;
    if(stream) cancelCamera();
    openCamera();
}
function sendImage() {
    const trackCode = document.getElementById('track-code').value.trim();
    if (!trackCode) return alert('Enter tracking code!');

    const input = document.getElementById('image-input');
    const file = input.files[0];
    if (!file) return alert('Select an image first!');

    const reader = new FileReader();
    reader.onload = function (e) {
        const timestamp = new Date().toLocaleTimeString();

        db.ref('chats/' + trackCode).push({
            sender: 'Admin',
            image: e.target.result,
            timestamp
        });

        input.value = ''; // reset input
    };
    reader.readAsDataURL(file);
}

</script>

</head>
<body>
   
<div class="chat-container">

<div class="chat-header">
    <h1>Fast Express Delivery Service</h1>
    <p>Admin Chat Panel</p>
</div>

<div class="track-input">
<label>Tracking Code:</label>
<input type="text" id="track-code" placeholder="FED-2025-001">
</div>

<div id="chat-box"></div>

<div class="input-row">
<input type="text" id="message-input" placeholder="Type your reply...">
<button onclick="sendMessage()">Send</button>
<button id="load-chat-btn">Load Chat</button>
</div>

<div class="input-row">
<button onclick="openCamera()">📸 Open Camera</button>
<button onclick="takeSnapshot()">📷 Snap Picture</button>
<input type="file" accept="image/*" id="image-input" style="display:none;" onchange="sendImage(event)">
<button onclick="document.getElementById('image-input').click()">📷 Send Picture</button>
</div>

<div class="camera-wrapper" id="camera-wrapper">
    <button class="cancel-btn" onclick="cancelCamera()">❌</button>
    <button class="switch-btn" onclick="switchCamera()">🔄</button>
    <video id="camera" autoplay></video>
</div>

</div>
</body>
</html>
